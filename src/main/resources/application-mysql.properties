spring.datasource.url=jdbc:mysql://localhost:3306/sistema_hospitalar?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# update = cria/atualiza as tabelas sem apagar os dados
spring.jpa.hibernate.ddl-auto=update

# Tirar quando o cadastro de usuarios existir de verdade
app.seed-admin=true
