# Banco H2 em memoria: apaga tudo quando o servidor para
spring.datasource.url=jdbc:h2:mem:hospital;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria as tabelas a partir das classes @Entity
spring.jpa.hibernate.ddl-auto=create-drop
# Mostra no terminal o SQL que o Hibernate executa (bom para aprender)
spring.jpa.show-sql=true

# Cria o usuario admin@hospital.com / admin123 se a tabela estiver vazia
app.seed-admin=true
